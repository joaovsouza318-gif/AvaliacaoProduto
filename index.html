<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Precificação de Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="div-geral">
        <h1>Cadastro e Precificação de Produtos</h1>
    
        <div id="div-form">
            <form id="produtoForm">
                <label for="nomeP">Descrição do Produto</label>
                <input type="text" name="nomeP" id="nomeP">
                    <br>

                <label for="valorUni">Preço Unitário do Produto</label>
                <input type="number" name="valorUni" id="valorUni" value="valorUni">
                    <br>

                <label for="quantidade">Quantidade de Produtos</label>
                <input type="text" name="quantidade" id="quantidade">
                    <br> <br>

                <button type="submit" name="submit" id="submit"> Calcular </button>
                <button type="reset"> Limpar formulário </button>
            </form>
                <br>

            <div id="div-resultado">
                
            </div>
        </div>

    </div>
    
    <script src="js/produto.js" type="module"></script>
</body>
</html>
